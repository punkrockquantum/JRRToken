# Fly.io: the booth server (shared league + Excel workbook) on one small machine in London with a
# volume at /data. A volume belongs to exactly one machine, so deploy with --ha=false.
#
#   fly launch --no-deploy --copy-config --name <unique-app-name>   # then set app = below to match
#   fly secrets set STAFF_PIN=<choose-a-pin>
#   fly deploy --ha=false                                            # creates the 1 GB volume on first deploy
#
app = "token-quest"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  EXPORT_PATH = "/data/Token Quest Leaderboard.xlsx"
  PORT = "8080"

[[mounts]]
  source = "token_quest_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
