# Publishes the static demo (no server, no /api) to GitHub Pages.
# One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Runs on every push to the game branch (main holds an older project), or by hand from the Actions tab.
# The github-pages environment must allow this branch: Settings -> Environments -> github-pages -> Deployment branches.
# A project site lives under https://<owner>.github.io/<repo>/, so the build gets BASE_PATH=/<repo>.
name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main, cursor/token-quest-datacenter-game]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      # The game itself is served, password-protected, from the Cloudflare Worker. GitHub Pages is
      # static and cannot be gated, so this site only forwards visitors to the team URL.
      - name: Build a redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://tokenquest.tokenquest.workers.dev/">
          <meta name="robots" content="noindex">
          <title>Token Quest has moved</title>
          <style>body{background:#0b0b1e;color:#f4f4ff;font-family:monospace;display:grid;place-items:center;height:100vh;margin:0}a{color:#ffd23f}</style>
          </head><body><p>Token Quest now lives at <a href="https://tokenquest.tokenquest.workers.dev/">tokenquest.tokenquest.workers.dev</a>.</p></body></html>
          HTML
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
