# Publishes the static demo (no server, no /api) to GitHub Pages.
# One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Runs on every push to the game branch (main holds an older project), or by hand from the Actions tab.
# The github-pages environment must allow this branch: Settings -> Environments -> github-pages -> Deployment branches.
# A project site lives under https://<owner>.github.io/<repo>/, so the build gets BASE_PATH=/<repo>.
name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main, cursor/token-quest-datacenter-game]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Build dist/
        run: npm run build:static
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository variable (Settings -> Secrets and variables -> Actions -> Variables), e.g.
          # https://tokenquest.<account-subdomain>.workers.dev. Unset = nothing is collected.
          INTAKE_URL: ${{ vars.INTAKE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
