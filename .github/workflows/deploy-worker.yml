# Deploys the whole game plus its /api as the Cloudflare Worker "tokenquest"
# (deploy/intake-worker/wrangler.toml, assets from dist/) on every push to the game branch, so
# https://tokenquest.<account-subdomain>.workers.dev tracks the branch just like GitHub Pages does.
#
# One-time setup, two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   https://dash.cloudflare.com/profile/api-tokens -> Create Token ->
#                          template "Edit Cloudflare Workers" (scope it to the one account)
#   CLOUDFLARE_ACCOUNT_ID  the 32-hex account id (`npx wrangler whoami` prints it)
# Until both exist the job skips with a notice instead of failing. The Worker's own secret
# (GITHUB_TOKEN for the private players repo) is set once with `wrangler secret put`, not here.
name: Deploy the game to Cloudflare Workers

on:
  push:
    branches: [cursor/token-quest-datacenter-game]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Explain the skip
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: |
          echo "::notice title=Cloudflare deploy skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the tokenquest Worker on push (see HOSTING.md, 'One URL on workers.dev')."
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        with:
          node-version: 22
      - name: Build dist/ (same-origin, no base path)
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: npm run build:worker
      - name: Deploy with wrangler
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy -c deploy/intake-worker/wrangler.toml
